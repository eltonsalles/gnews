name: AI Security Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Gemini Security Review
        uses: anc95/ChatGPT-CodeReview@v1.0.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_ENDPOINT: https://generativelanguage.googleapis.com/v1beta/openai
          MODEL: gemini-2.5-pro
          LANGUAGE: Portuguese
          temperature: 0.1
          MAX_PATCH_LENGTH: 20000
          INCLUDE_PATTERNS: "*.java,pom.xml,*.properties,*.yml,*.yaml"
          IGNORE_PATTERNS: ".github/**,*.md"
          PROMPT: |
            Você é um Engenheiro de Segurança de Aplicações (AppSec) revisando um PR
            de uma API Java 25 / Spring Boot 3.5 que usa spring-boot-starter-jdbc.
            Analise APENAS o diff abaixo e procure vulnerabilidades, priorizando:
            - SQL Injection (concatenação de strings em JdbcTemplate/queries nativas)
            - Falhas de validação de entrada (falta de @Valid, Bean Validation)
            - Exposição de dados sensíveis (secrets hardcoded, logs com dados pessoais/tokens)
            - SSRF ao chamar APIs externas com URLs controladas pelo usuário
            - Desserialização insegura, path traversal, CORS/headers permissivos
            - Dependências vulneráveis adicionadas no pom.xml
            Para cada achado informe: severidade (Crítica/Alta/Média/Baixa), CWE,
            trecho afetado, explicação do risco e correção sugerida em código.
            Se não houver vulnerabilidades, responda apenas "Nenhuma vulnerabilidade
            identificada". Não comente estilo ou formatação.
